
<div *ngIf="!sharedvar.isLoggedIn">
<div>
   <mat-toolbar color="primary">  
      <div>
         Walchand College of Engineering, Sangli
      </div>
      <div class="spacer"></div>
      <a  mat-button *ngIf="!sharedvar.isLoggedIn" routerLink="home">Home</a>
      <a  mat-button *ngIf="!sharedvar.isLoggedIn" routerLink="admin/login">Admin Login</a>
      <a  mat-button *ngIf="!sharedvar.isLoggedIn" routerLink="user/login">User Login</a>
      <a  mat-button *ngIf="!sharedvar.isLoggedIn" routerLink="about-us">About Us</a>
   </mat-toolbar>
  
</div>
<router-outlet></router-outlet>
</div>

<div *ngIf="sharedvar.isLoggedIn && !sharedvar.isAdmin">
<mat-toolbar class="mat-elevation-z8">
   <button mat-icon-button  (click)="sidenav.toggle()">
     <mat-icon> menu </mat-icon>
   </button>
   
   <div> WCE E-DOC SYSTEM</div>
   <div class="spacer"></div>
   <button  mat-raised-button color="warn" (click)="logout()" ><mat-icon>logout</mat-icon>
       LOGOUT</button>

</mat-toolbar>

 <mat-sidenav-container>
   <mat-sidenav #sidenav="matSidenav" class="mat-elevation-z8">
     <button mat-button class="menu-button" routerLink="/user/dashboard">
       <mat-icon>home</mat-icon>
       <span>Dashboard</span>
     </button>
     <button mat-button class="menu-button" routerLink="/user/documents">
       <mat-icon>description</mat-icon>
       <span>My Documents</span>
     </button>
     <button mat-button class="menu-button" routerLink="/user/newRequest">
       <mat-icon>launch</mat-icon>
       <span>New Request</span>
     </button>
     <button mat-button class="menu-button" routerLink="/user/myRequests">
       <mat-icon>list</mat-icon>
       <span>My requests</span>
     </button>
     <mat-divider></mat-divider>
 
     <button mat-button class="menu-button" routerLink="/user/profile">
       <mat-icon>person</mat-icon>
       <span>My Profile</span>
     </button>
     
     <button mat-button class="menu-button" (click)="logout()" >
       <mat-icon>logout</mat-icon>
       <span>Logout</span>
     </button>
     <mat-divider></mat-divider>

     <button mat-button class="menu-button" routerLink="/user/help">
       <mat-icon>help</mat-icon>
       <span>Help</span>
     </button>
   </mat-sidenav>
   
   <mat-sidenav-content> 
     <div class="content mat-elevation-z8">
       
       <router-outlet></router-outlet>
     </div>
   </mat-sidenav-content>
 </mat-sidenav-container>
</div>

<div *ngIf="sharedvar.isLoggedIn && sharedvar.isAdmin">
   <mat-toolbar class="mat-elevation-z8">
       <button mat-icon-button  (click)="sidenav.toggle()">
         <mat-icon> menu </mat-icon>
       </button>
       
       <div> WCE E-DOC SYSTEM</div>
       <div class="spacer"></div>
       <button  mat-raised-button color="warn" (click)="logout()" > <mat-icon>logout</mat-icon>LOGOUT</button>

   </mat-toolbar>
   
     <mat-sidenav-container>
       <mat-sidenav #sidenav="matSidenav" class="mat-elevation-z8">
         <button mat-button class="menu-button" routerLink="/admin/dashboard">
           <mat-icon>home</mat-icon>
           <span>Dashboard</span>
         </button>
         
         <button mat-button class="menu-button" routerLink="/admin/allUsers">
           <mat-icon>list</mat-icon>
           <span>All users</span>
         </button>
         <button mat-button class="menu-button" routerLink="/admin/userLogs">
           <mat-icon>hourglass_empty</mat-icon>
           <span>User Logs</span>
         </button>
         <button mat-button class="menu-button" routerLink="/admin/allRequests">
           <mat-icon>list</mat-icon>
           <span>All Requests</span>
         </button>
         <button mat-button class="menu-button" routerLink="/admin/documentTypes">
           <mat-icon>description</mat-icon>
           <span>Document Types</span>
         </button>
         <mat-divider></mat-divider>
     
         <button mat-button class="menu-button" routerLink="/admin/profile">
           <mat-icon>person</mat-icon>
           <span>My Profile</span>
         </button>
         
         <button mat-button class="menu-button" (click)="logout()" >
           <mat-icon>logout</mat-icon>
           <span>Logout</span>
         </button>
         <mat-divider></mat-divider>

         <button mat-button class="menu-button" routerLink="/admin/help">
           <mat-icon>help</mat-icon>
           <span>Help</span>
         </button>
       </mat-sidenav>
       
       <mat-sidenav-content> 
         <div class="content mat-elevation-z8">
          
           <router-outlet></router-outlet>
         </div>
       </mat-sidenav-content>
     </mat-sidenav-container>
</div>

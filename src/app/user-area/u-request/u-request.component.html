<div *ngIf="!sharedvar.isLoggedIn">
    <mat-card >
        Forbidden : Please login to access this page
    </mat-card>
</div>
<div *ngIf="sharedvar.isLoggedIn && sharedvar.isAdmin">
    <mat-card >
        You're admin. Please login as user to access this page
    </mat-card>
</div>
<div *ngIf="sharedvar.isLoggedIn && !sharedvar.isAdmin">
    <mat-card>
        <!-- logged in as user : {{sharedvar.isAdmin}} -->
        <mat-tab-group
        <mat-tab label="Add Document Type">
            <form [formGroup]="addDocTypeForm">
                <div>
                    <mat-form-field>
                        <mat-label>Document Name</mat-label>
                        <input formControlName="name" matInput type="text" required placeholder="1234">
                        <mat-error>This field is required</mat-error>
                    </mat-form-field>
                </div>
                <div>
                    <mat-form-field>
                        <mat-label>Approval from</mat-label>
                        <mat-select required formControlName="sendTo">
                            <mat-option *ngFor="let af of ApprovalFromVar" [value]="af">
                                {{af}}
                            </mat-option>
                        </mat-select>
                        <mat-error>This field is required</mat-error>
                    </mat-form-field>
                </div>
                <div>
                    <mat-form-field class="example-chip-list">
                        <mat-chip-list #chipList>

                            <input placeholder="Required documents" [matChipInputFor]="chipList"
                                [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                                [matChipInputAddOnBlur]="addOnBlur" (matChipInputTokenEnd)="add($event)">
                        </mat-chip-list>

                    </mat-form-field>
                    <mat-chip *ngFor="let docType of documentTypes" [selectable]="selectable"
                        [removable]="removable" (removed)="remove(docType)">
                        {{docType.name}}
                        <mat-icon matChipRemove *ngIf="removable">cancel</mat-icon>
                    </mat-chip>
                </div>
            </form>

            <div class="button-row">
                <button mat-raised-button color="primary" (click)="onSubmit()"
                    [disabled]="!addDocTypeForm.valid">Create</button>
                &nbsp;&nbsp;<button mat-raised-button color="primary" (click)="resetForm()">Reset</button>
            </div>
        </mat-tab>
    </mat-tab-group>
    </mat-card>
</div>

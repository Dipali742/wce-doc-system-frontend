<div *ngIf="!sharedvar.isLoggedIn">
  <mat-card> Forbidden : Please login to access this page </mat-card>
</div>
<div *ngIf="sharedvar.isLoggedIn && !sharedvar.isAdmin">
  <mat-card> You're user. Please login as admin to access this page </mat-card>
</div>
<div *ngIf="sharedvar.isLoggedIn && sharedvar.isAdmin">
  <mat-card>
    <!-- logged in as admin : {{sharedvar.isAdmin}} -->
    <mat-tab-group>
      <mat-tab label="New Student Requests">
        <ag-grid-angular
          style="height: 500px"
          class="ag-theme-alpine"
          [rowData]="studentRequestGridData"
          [columnDefs]="studentRequestGridColumns"
          rowSelection="multiple"
          sideBar="{toolPanels: ['columns','filters']}"
          [pagination]="true"
          [paginationPageSize]="10"
          (cellClicked)="
            clickedOnActions($event.type, $event.column, $event.data, $event)
          "
        >
        </ag-grid-angular>
      </mat-tab>
    </mat-tab-group>
  </mat-card>
</div>
